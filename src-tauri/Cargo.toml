[package]
name = "schematadb"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "schematadb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
schematadb-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-decorum = "1"
tauri-plugin-single-instance = "2"
open = "5"
dirs = "6"
dunce = "1"
md5 = "0.8"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }
# Same versions as Tauri's, so the WebView2 interfaces it hands out can be cast to newer settings interfaces.
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"
