[package]
name = "projectcat-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.42.0", features = ["bundled", "column_decltype", "hooks"] }
async-trait = "0.1.92"
keyring = "4.2.0"
uuid = { version = "1.29.2", features = ["v4"] }
tokio-util = "0.7.20"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "tls-rustls-ring-webpki"] }
futures = "0.3.34"

[dev-dependencies]
tempfile = "3.27.0"
testcontainers = { version = "0.28.0", features = ["reusable-containers"] }
tokio = { workspace = true, features = ["full"] }
