name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (SQLite, MySQL 8.4, MariaDB 11.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p schematadb-core --all-targets -- -D warnings
      # testcontainers starts the MySQL and MariaDB containers through the runner's Docker daemon.
      - run: cargo test -p schematadb-core

  frontend:
    name: Frontend typecheck, tests and license notices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The app ships THIRD_PARTY_LICENSES.txt; fail when a dependency change left it stale.
      - run: pnpm notices --check

  bundle:
    name: Bundle (${{ matrix.platform }})
    needs: [core, frontend]
    # Version tags draft a release with the platform's standard installer.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        run: node scripts/build.mjs native
      # On version tags the action also drafts a GitHub release with the installers attached.
      - uses: tauri-apps/tauri-action@v0
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Schemata ${{ github.ref_name }}
          releaseDraft: true
          # Tags such as v1.0.0-rc.1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # RPM rejects pre-release versions containing '-'; Linux ships .deb and AppImage.
          args: ${{ runner.os == 'Linux' && '--bundles deb,appimage' || '' }}
      - name: Attach Windows installer to draft release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            flags=(--draft --title "Schemata $tag")
            if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
            # Another platform may create the same draft concurrently.
            gh release create "$tag" "${flags[@]}" || gh release view "$tag" > /dev/null
          fi
          gh release upload "$tag" package/windows/*.exe --clobber
      # After the bundle, so the frontend dist that tauri::generate_context! embeds exists.
      - name: Clippy (workspace)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: schematadb-${{ matrix.platform }}
          path: |
            package/windows/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
