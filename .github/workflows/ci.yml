name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (SQLite, MySQL 8.4, MariaDB 11.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p schematadb-core --all-targets -- -D warnings
      # testcontainers starts the MySQL and MariaDB containers through the runner's Docker daemon.
      - run: cargo test -p schematadb-core

  frontend:
    name: Frontend typecheck, tests and license notices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The app ships THIRD_PARTY_LICENSES.txt; fail when a dependency change left it stale.
      - run: pnpm notices --check

  bundle:
    name: Bundle (${{ matrix.platform }})
    needs: [core, frontend]
    # tauri-action drafts a release on version tags.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # On version tags the action also drafts a GitHub release with the installers attached.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Schemata ${{ github.ref_name }}
          releaseDraft: true
          # Tags such as v1.0.0-rc.1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # MSI rejects non-numeric pre-release versions (1.0.0-rc.1); Windows ships the NSIS setup only, like `make`.
          args: ${{ runner.os == 'Windows' && '--bundles nsis' || '' }}
      # After the bundle, so the frontend dist that tauri::generate_context! embeds exists.
      - name: Clippy (workspace)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: schematadb-${{ matrix.platform }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
