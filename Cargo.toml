[workspace]
resolver = "3"
members = ["src-tauri", "crates/projectcat-core"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
projectcat-core = { path = "crates/projectcat-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
thiserror = "2"
