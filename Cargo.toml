[workspace]
resolver = "3"
members = ["src-tauri", "crates/schematadb-core"]

[workspace.package]
edition = "2024"
version = "1.0.0-rc.3"
license = "MIT"

[workspace.dependencies]
schematadb-core = { path = "crates/schematadb-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
thiserror = "2"
